name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  demo-client:
    needs: check
    if: github.event_name == 'push'
    concurrency:
      group: demo-client
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The client derives its Socket.IO path from this base.
      - run: npm run build --workspace client -- --base=/opensource/chalkboard/

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::993011736775:role/gh-deploy-opensource-chalkboard
          aws-region: us-east-1

      - name: Publish to ayers.repair/opensource/chalkboard/
        run: |
          aws s3 sync client/dist/ s3://ayers-repair-site-993011736775/opensource/chalkboard/ \
            --delete --cache-control "public, max-age=300" --only-show-errors
          aws cloudfront create-invalidation --distribution-id E1CZIGG4O8R7UI \
            --paths "/opensource/chalkboard/*" --query Invalidation.Id --output text

  demo-relay:
    needs: check
    if: github.event_name == 'push'
    concurrency:
      group: demo-relay
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/zachariahayers/chalkboard:latest
          # Links the package to the repo; the demo instance prunes old images by this label.
          labels: org.opencontainers.image.source=https://github.com/ZachariahAyers/chalkboard

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::993011736775:role/gh-deploy-opensource-chalkboard
          aws-region: us-east-1

      - name: Redeploy the relay on the demo instance
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          DOC: opensource-redeploy-chalkboard
          INSTANCE: i-04665903be2862f70
        run: |
          set -euo pipefail
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name "$DOC" \
            --parameters "{\"ImageDigest\":[\"$DIGEST\"]}" --query Command.CommandId --output text)
          status=Pending
          for _ in $(seq 1 120); do
            # A new invocation is not readable at once; a refused read counts as pending.
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success | Failed | Cancelled | TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text || true
          [ "$status" = Success ] || { echo "::error::the redeploy ended $status"; exit 1; }
